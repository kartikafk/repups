services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  redis:
    image: redis:7-alpine
  server:
    build: ./server
    ports: ["5001:5001"]
    env_file:
      - ./server/.env
    environment:
      ML_SERVICE_URL: http://ml-service:8000
      PORT: 5001
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, ml-service, redis]
  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
    env_file:
      - ./server/.env
    environment:
      MIN_NEW_ROWS_FOR_RETRAIN: 50
    depends_on: [mongo]
    volumes:
      - ml-model-store:/app/app/models_store
      - ml-dataset-store:/app/app/datasets

volumes:
  ml-model-store:
  ml-dataset-store:
