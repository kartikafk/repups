name: repups_flutter
description: RepUps - Fitness tracking and coaching platform (Flutter native)

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^0.13.5
  dio: ^5.3.2
  
  # Secure Storage (JWT tokens) - temporarily web only
  # flutter_secure_storage: ^9.2.2  # Temporarily disabled for web dev
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^12.1.3
  
  # Native workout/posture capture
  camera: ^0.11.3
  google_mlkit_pose_detection: ^0.14.0
  image_picker: ^1.1.2
  
  # Socket.IO for real-time features
  socket_io_client: ^2.0.3+1
  
  # Native payment checkout
  razorpay_flutter: ^1.4.0
  
  # UI & Utils
  cupertino_icons: ^1.0.6
  # cached_network_image: ^3.3.0  # Temporarily disabled for web dev
  flutter_svg: ^2.0.9
  intl: ^0.18.1
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2  # For web token storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - web/images/
    - web/images/dashboard/
    - web/images/ai-insight/
  
  # Add custom fonts (Syne, DM Sans, Space Mono)
  # fonts:
  #   - family: Syne
